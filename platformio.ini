[platformio]
default_envs = uno

[env]
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0

[env:uno]
platform = atmelavr
board = uno

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3

[env:native]
platform = native
framework =
test_framework = unity
; Native tests use the fakes in test/fakes. The real Adafruit_NeoPixel
; library must not leak into this environment.
lib_deps =
build_flags = -I test/fakes
